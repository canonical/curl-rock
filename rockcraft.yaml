name: curl

base: bare
# TODO: Update once 26.10 is stabilized
build-base: devel
version: '8.20'
summary: Command line tool for transferring data with URL syntax
description: |
    Rock for curl, a command line tool for transferring data with URL syntax,
    supporting various protocols including HTTP, HTTPS, FTP, and more.
platforms:
    amd64:
    arm64:
    ppc64el:
    s390x:

parts:
    curl:
        plugin: nil

        # TODO: Uncomment once 26.10 is stabilized
        # stage-packages:
        #     - base-files_release-info
        #     - base-files_chisel
        #     - curl_bins
        #     - ca-certificates_data-with-certs

        # TODO: Remove once 26.10 is stabilized
        override-build: |
          craftctl default
          chisel cut --release ubuntu-26.10 --root ${CRAFT_PART_INSTALL} \
            base-files_release-info \
            curl_bins \
            ca-certificates_data-with-certs


    deb-security-manifest:
        plugin: make
        after: [curl]
        source: https://github.com/canonical/rocks-security-manifest
        source-type: git
        source-branch: main
        override-prime: gen_manifest

